<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="../icon-180.png">
<title>ESP v2 preview</title>
<style>
  :root { --bg:#000; --ink:#f2f2f2; --muted:#8a8a8a; --line:#2a2a2a; --metal-1:#3a3a3a; --metal-2:#1c1c1c; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system, system-ui, "Segoe UI", Inter, sans-serif; -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
  main { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
    padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px); }
  header { text-align:center; }
  h1 { font-size:17px; font-weight:600; margin:0; letter-spacing:.2px; }
  .sub { color:var(--muted); font-size:13px; margin-top:4px; }
  /* urządzenie: okrągła ramka z dwoma przyciskami po prawej, jak na płytce */
  .device { --d:min(78vw, 360px); position:relative; width:calc(var(--d) + 28px); height:calc(var(--d) + 28px); border-radius:50%;
    background:radial-gradient(circle at 30% 25%, var(--metal-1), var(--metal-2) 70%); box-shadow:0 18px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center; }
  canvas { width:var(--d); height:var(--d); border-radius:50%; background:#000; display:block; touch-action:none; cursor:pointer; }
  .hw { appearance:none; -webkit-appearance:none; display:block; z-index:2; position:absolute; right:-8px; width:12px; height:46px; border-radius:6px; border:0; padding:0;
    background:linear-gradient(90deg, #4a4a4a, #8a8a8a); box-shadow:0 1px 2px rgba(0,0,0,.5); cursor:pointer; touch-action:none; }
  .hw:active { transform:translateX(-2px); }
  .hw.top { top:24%; } .hw.bot { top:62%; }
  .legend { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px; color:var(--muted); max-width:360px; }
  .legend b { color:var(--ink); font-weight:500; white-space:nowrap; }
  .note { font-size:12px; color:#5c5c5c; text-align:center; max-width:340px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>ESP v2 — live preview</h1>
    <div class="sub" id="sub">Runs the same interface code as the device.</div>
  </header>
  <div class="device">
    <canvas id="cv" width="466" height="466" aria-label="ESP screen"></canvas>
    <button class="hw top" id="top" type="button" aria-label="Top button: screen on/off"></button>
    <button class="hw bot" id="bot" type="button" aria-label="Bottom button: tap = apps/home, hold = flashlight"></button>
  </div>
  <div class="legend">
    <b>Swipe up / tap</b><span>apps</span>
    <b>Swipe down</b><span>quick panel</span>
    <b>From left edge →</b><span>back</span>
    <b>Bottom button</b><span>tap: apps / home · hold: flashlight</span>
    <b>Top button</b><span>screen on / off</span>
  </div>
  <div class="note">Not connected to your ESP yet — battery and live state arrive with the network stage.</div>
</main>
<script>
(async () => {
  const cv = document.getElementById('cv'), X = cv.getContext('2d');
  const img = X.createImageData(466, 466), out = new Uint32Array(img.data.buffer);
  // RGB565 w kolejności bajtów ekranu (starszy bajt pierwszy) → RGBA; tablica dla każdej możliwej wartości 16-bitowej
  const lut = new Uint32Array(65536);
  for (let raw = 0; raw < 65536; raw++) {
    const v = ((raw & 255) << 8) | (raw >> 8);                 // Uint16Array czyta little-endian — zamiana bajtów
    const r = ((v >> 11) * 255 / 31) | 0, g = (((v >> 5) & 63) * 255 / 63) | 0, b = ((v & 31) * 255 / 31) | 0;
    lut[raw] = (255 << 24) | (b << 16) | (g << 8) | r;
  }
  let wasm;
  try {
    const res = await fetch('esp.wasm', { cache: 'no-cache' });
    ({ instance: wasm } = await WebAssembly.instantiate(await res.arrayBuffer(), {}));
  } catch (e) { document.getElementById('sub').textContent = 'Could not load the preview: ' + e; return; }
  const E = wasm.exports;
  E._initialize();
  let fb = new Uint16Array(E.memory.buffer, E.fb_ptr(), 466 * 466);
  // ustawienia jak w urządzeniu (tu: pamięć przeglądarki)
  try { E.set_bright(+(localStorage.getItem('v2.brightv') ?? 150)); E.set_dnd(+(localStorage.getItem('v2.dnd') ?? 0)); } catch (e) {}
  let savedB = E.get_bright(), savedD = E.get_dnd();

  // dotyk: współrzędne w pikselach ekranu ESP
  const touch = { on: false, x: 233, y: 233 };
  const pos = ev => { const r = cv.getBoundingClientRect(); return [Math.round((ev.clientX - r.left) * 466 / r.width), Math.round((ev.clientY - r.top) * 466 / r.height)]; };
  let screenOn = true, lastInput = performance.now();
  const wake = () => { lastInput = performance.now(); if (!screenOn) { screenOn = true; return true; } return false; };
  let swallow = false;                                          // pierwszy dotyk zgaszonego ekranu tylko budzi (jak na ESP)
  cv.addEventListener('pointerdown', ev => { cv.setPointerCapture(ev.pointerId); swallow = wake(); if (swallow) return; [touch.x, touch.y] = pos(ev); touch.on = true; });
  cv.addEventListener('pointermove', ev => { if (!touch.on) return; [touch.x, touch.y] = pos(ev); lastInput = performance.now(); });
  const up = () => { touch.on = false; swallow = false; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  // przyciski: górny = ekran wł./wył.; dolny = krótko / przytrzymanie 0,6 s
  document.getElementById('top').addEventListener('click', () => { if (screenOn) { screenOn = false; draw(true); } else wake(); });
  const bot = document.getElementById('bot'); let botT = 0, botLong = false, botWake = false;
  bot.addEventListener('pointerdown', ev => { bot.setPointerCapture(ev.pointerId); botWake = wake(); botLong = false;
    botT = setTimeout(() => { botLong = true; E.btn_long(); lastInput = performance.now(); }, 600); });
  const botUp = () => { clearTimeout(botT); if (!botLong && !botWake) E.btn_short(); botWake = false; lastInput = performance.now(); };
  bot.addEventListener('pointerup', botUp); bot.addEventListener('pointercancel', () => clearTimeout(botT));

  let shownB = -1;
  function draw(force) {
    if (!screenOn) { X.fillStyle = '#000'; X.fillRect(0, 0, 466, 466); cv.style.filter = ''; shownB = -1; return; }
    if (!fb.length) fb = new Uint16Array(E.memory.buffer, E.fb_ptr(), 466 * 466);   // pamięć modułu urosła — nowy widok
    for (let i = 0; i < out.length; i++) out[i] = lut[fb[i]];
    X.putImageData(img, 0, 0);
  }
  function setBright(b) {                                     // panel przyciemnia cały obraz — tu filtr CSS
    const f = Math.min(1, b / E.normal_brightness());
    if (Math.abs(f - shownB) > 0.004) { cv.style.filter = f >= 0.999 ? '' : `brightness(${f.toFixed(3)})`; shownB = f; }
  }
  function loop() {
    const now = performance.now();
    if (screenOn && now - lastInput > (E.get_screen() === 3 ? 300000 : 45000)) { screenOn = false; draw(true); }
    if (screenOn) {
      const d = new Date();
      const b = E.frame(now | 0, touch.on ? 1 : 0, touch.x, touch.y, d.getHours(), d.getMinutes(), d.getSeconds(), d.getMilliseconds(),
                        d.getDate(), d.getMonth() + 1, d.getDay(), -1, 0);
      if (b >= 0) { draw(); setBright(b); }
      if (E.power_req()) { screenOn = false; draw(true); document.getElementById('sub').textContent = 'The ESP would switch off now. Press the top button.'; }
      const nb = E.get_bright(), nd = E.get_dnd();
      if (nb !== savedB || nd !== savedD) { savedB = nb; savedD = nd; try { localStorage.setItem('v2.brightv', nb); localStorage.setItem('v2.dnd', nd); } catch (e) {} }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
