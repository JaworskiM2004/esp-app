<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESP</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ESP">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: logowanie → ekran startowy z kafelkami → każda funkcja otwiera się jako osobny panel z przyciskiem wstecz. Na górze zawsze tylko stan urządzenia. Czerń #000 pod AMOLED, szare obramówki zamiast wypełnień. */
:root{
  --bg:#000; --raise:#0d0d0d; --line:#232323; --line-2:#333; --line-3:#474747;
  --ink:#ededed; --ink-2:#bdbdbd; --muted:#7c7c7c; --icon:#c6c6c6;
  --ok:#5fd38d; --bad:#ff7b6e;
  --ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:var(--icon);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}

/* pasek stanu */
.status{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:flex-end;gap:18px;height:48px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.st.off svg.i{stroke:#4d4d4d}
.st svg.i{width:20px;height:20px}
.battsvg{width:30px;height:16px;display:block;overflow:visible}
.battsvg .shell{fill:none;stroke:var(--icon);stroke-width:1.5}
.battsvg .nub{fill:var(--icon)}
.battsvg .lvl{fill:var(--ink-2)}
.battsvg .bolt{fill:#000;stroke:#000;stroke-width:1.4;stroke-linejoin:round;display:none}
.st.chg{color:var(--ok)}
.st.chg .battsvg .shell{stroke:var(--ok)}
.st.chg .battsvg .nub,.st.chg .battsvg .lvl{fill:var(--ok)}
.st.chg .battsvg .bolt{display:block}
.st.low .battsvg .lvl{fill:var(--bad)}

/* nagłówek panelu */
.head{display:flex;align-items:center;gap:6px;height:52px;margin-top:2px}
.head h1{font-size:20px;font-weight:620;margin:0}
.back{width:44px;height:44px;margin-left:-10px;border:0;background:transparent;border-radius:12px;display:inline-flex;align-items:center;justify-content:center}

main{flex:1;padding-block:8px 40px;padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px}
#v-home-screen{will-change:transform}
/* panele funkcji: wjeżdżają z prawej nad ekran startowy, pasek stanu zostaje na wierzchu */
.panel{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 48px);z-index:4;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding-left:max(16px,env(safe-area-inset-left,0px),calc(50vw - 260px));padding-right:max(16px,env(safe-area-inset-right,0px),calc(50vw - 260px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px));box-sizing:border-box;will-change:transform}
.panel.moving{box-shadow:-1px 0 0 var(--line-2)}

/* ekran startowy */
.brand{font-size:34px;font-weight:680;letter-spacing:.01em;margin:6px 0 10px}
/* kafelki: wszystkie kwadratowe, same ikony */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:calc(50svh - 48px - env(safe-area-inset-top,0px) - 8px)}
@media (max-height:560px){.grid{margin-top:24px}}
.tile{aspect-ratio:1;max-width:100%;border:1px solid var(--line-2);border-radius:30px;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:0;box-sizing:border-box}
.tile:active{background:var(--raise);border-color:var(--line-3)}
.tile svg.i{width:50px;height:50px;stroke-width:1.35}


/* okrągły ekran urządzenia (wspólny dla edytora i podglądu) */
.screen{--d:280px;width:var(--d);height:var(--d);border-radius:50%;overflow-y:auto;overflow-x:hidden;background:#000;position:relative;scrollbar-width:none;overscroll-behavior:contain;flex:none}
.screen::-webkit-scrollbar{display:none}
.screen .ph{width:var(--d);height:var(--d);position:relative;overflow:hidden;border-radius:50%;touch-action:pan-y}
.screen .ph img{position:absolute;left:0;top:0;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.screen.crop .ph{touch-action:none;cursor:grab}
.screen .tx{font-size:calc(var(--d) * .058);line-height:1.38;color:#f3f3f3;text-align:center;padding:0 calc(var(--d) * .08) calc(var(--d) * .3);word-break:normal;overflow-wrap:normal;hyphens:none}
.screen .tx.after{padding-top:calc(var(--d) * .07)}
/* górna połowa tekstu idzie po okręgu; niżej stała szerokość (dół i tak się przewija) */
.screen .sh{height:calc(var(--d) / 2);width:calc(var(--d) / 2 - var(--d) * .08)}
.screen .sh.l{float:left;shape-outside:radial-gradient(circle at 100% 100%,transparent calc(var(--d) * .41),#000 calc(var(--d) * .41 + 1px))}
.screen .sh.r{float:right;shape-outside:radial-gradient(circle at 0 100%,transparent calc(var(--d) * .41),#000 calc(var(--d) * .41 + 1px))}
.screen .tx.after .sh{display:none}
.screen .ph.after{margin-top:calc(var(--d) * .04)}
.screen .blank{height:var(--d);display:flex;align-items:center;justify-content:center;color:#5a5a5a;font-size:calc(var(--d) * .05)}

/* edytor wiadomości */
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0}
.bezel-lite{border-radius:50%;padding:7px;border:1px solid var(--line-2)}
.bezel-lite .screen{box-shadow:inset 0 0 0 1px var(--line-3)}
.hint{font-size:13px;color:var(--muted);text-align:center;min-height:19px}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tbtn{width:52px;height:52px;border-radius:16px;border:1px solid var(--line-2);background:var(--bg);display:inline-flex;align-items:center;justify-content:center;position:relative}
.tbtn[aria-pressed="true"]{border-color:var(--ink-2);background:var(--raise)}
.tbtn:disabled{opacity:.3;cursor:default}
.tbtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.zoom{display:flex;align-items:center;gap:12px;padding:0 6px}
.zoom svg.i{width:18px;height:18px}
input[type=range]{flex:1;accent-color:#cfcfcf}
textarea{width:100%;box-sizing:border-box;min-height:120px;resize:vertical;border:1px solid var(--line-2);border-radius:18px;background:var(--bg);padding:14px 16px;line-height:1.5}
textarea::placeholder{color:var(--muted)}
textarea:focus{border-color:var(--line-3);outline:none}
.send{height:64px;border-radius:18px;border:0;background:var(--ink);color:#000;font-size:17px;font-weight:620;display:flex;align-items:center;justify-content:center;gap:10px}
.send svg.i{stroke:#000;width:26px;height:26px}
.send:disabled{opacity:.35;cursor:default}
.onair{display:flex;align-items:center;gap:12px;border:1px solid var(--line-2);border-radius:18px;padding:12px}
.onair .mini{width:52px;height:52px;border-radius:50%;border:1px solid var(--line-3);overflow:hidden;flex:none;position:relative}
.onair .lbl{flex:1;min-width:0}
.onair .lbl small{display:block;font-size:12px;color:var(--muted)}
.onair .lbl span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);font-size:14px}
.sbtn{width:44px;height:44px;border-radius:13px;border:1px solid var(--line-2);background:var(--bg);display:inline-flex;align-items:center;justify-content:center;flex:none}
.mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mini .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}

/* podgląd: srebrne urządzenie */
.device{position:relative;width:min(86vw,330px);aspect-ratio:1;max-width:100%;margin:10px auto 0}
.device .ring{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 210deg,#8d8f93,#e9eaec 12%,#9fa2a6 25%,#5f6266 38%,#cfd1d4 52%,#8a8d91 66%,#f2f3f4 80%,#7e8185 92%,#8d8f93);
  box-shadow:0 0 0 1px #2c2c2c,0 18px 40px rgba(255,255,255,.04)}
.device .ring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#050505;box-shadow:inset 0 0 0 1px #1a1a1a}
.device .scr{position:absolute;inset:6.5%;border-radius:50%;display:flex}
.device .btns{position:absolute;right:-7px;top:34%;display:flex;flex-direction:column;gap:12%;height:32%}
.device .btns i{width:7px;flex:1;border-radius:0 4px 4px 0;background:linear-gradient(90deg,#6a6d71,#c9cbce)}
.device .spk{position:absolute;right:2.2%;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;z-index:1}
.device .spk i{width:3px;height:3px;border-radius:50%;background:#2a2a2a}
.live{display:flex;justify-content:center;margin-top:4px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* listy ustawień i kontrolera */
.rows{border:1px solid var(--line-2);border-radius:18px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);min-height:28px}
.row:first-child{border-top:0}
.row .lbl{flex:1;min-width:0}
.row .val{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.row .mono{font-family:var(--mono)}
.switch{position:relative;width:48px;height:29px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;border:1px solid var(--line-3)}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:var(--muted);transition:transform .2s}
.switch input:checked+span{border-color:var(--ink-2);background:#1b1b1b}
.switch input:checked+span::after{transform:translateX(19px);background:var(--ink)}
.cap{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:6px 4px -6px}
.empty{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:48px 20px;border:1px solid var(--line-2);border-radius:22px;color:var(--ink-2)}
.empty .halo{width:72px;height:72px;border-radius:50%;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center}
.empty .halo svg.i{width:30px;height:30px}
.empty p{margin:0;color:var(--muted);font-size:14px;max-width:30ch}
.btn{height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line-3);background:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:560}
.btn:disabled{opacity:.35;cursor:default}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ink-2);transition:width .3s}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);border:1px solid var(--line-3);background:#0b0b0b;border-radius:14px;padding:11px 16px;font-size:14px;z-index:9;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* logowanie */
.login{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.login .logo{width:84px;height:84px;border-radius:26px;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.login .logo svg.i{width:44px;height:44px;stroke-width:1.35}
.login input{width:100%;max-width:340px;height:54px;box-sizing:border-box;border:1px solid var(--line-2);border-radius:16px;background:var(--bg);padding:0 16px;font-size:16px}
.login input:focus{outline:none;border-color:var(--line-3)}
.login .send{width:100%;max-width:340px}
.login .err{min-height:20px;font-size:14px;color:var(--bad);text-align:center}
.steps{display:flex;gap:4px;flex:none}
.steps i{width:6px;height:6px;border-radius:50%;border:1px solid var(--line-3)}
.steps i.on{background:var(--ink-2);border-color:var(--ink-2)}
.steps i.read{background:var(--ok);border-color:var(--ok)}
.busy svg.i{animation:pulse 1s ease-in-out infinite}
.st.stale{opacity:.45}
</style>
</head>

<form class="login" id="login" hidden autocomplete="on">
  <div class="logo"><svg class="i"><use href="#i-esp"/></svg></div>
  <input type="email" id="lEmail" autocomplete="username" placeholder="E-mail" required aria-label="E-mail">
  <input type="password" id="lPass" autocomplete="current-password" placeholder="Hasło" required aria-label="Hasło">
  <button class="send" id="lBtn" type="submit" aria-label="Zaloguj"><svg class="i"><use href="#i-back" transform="rotate(180 12 12)"/></svg></button>
  <div class="err" id="lErr" role="alert"></div>
</form>
<div class="app" id="app" hidden>
  <div class="status" id="status" aria-label="Stan urządzenia">
    <span class="st off" id="sWifi" title="Wi-Fi"><svg class="i"><use href="#i-wifi"/></svg></span>
    <span class="st off" id="sBt" title="Bluetooth"><svg class="i"><use href="#i-bt"/></svg></span>
    <span class="st" id="sBatt" title="Bateria"><svg class="battsvg" viewBox="0 0 30 16" aria-hidden="true"><rect class="shell" x=".75" y=".75" width="25.5" height="14.5" rx="4"/><rect class="nub" x="27.3" y="5" width="2.2" height="6" rx="1"/><rect class="lvl" id="battFill" x="3" y="3" width="21" height="10" rx="2"/><path class="bolt" d="M15.2 2.2 9.6 8.9h4.1l-1 4.9 5.6-6.7h-4.1z"/></svg><span id="battPct">--</span></span>
  </div>

  <main>
    <!-- START -->
    <section class="view" id="v-home-screen">
      <div class="grid">
        <button class="tile" data-go="v-msg" type="button" aria-label="Wiadomość"><svg class="i"><use href="#i-chat"/></svg></button>
        <button class="tile" data-go="v-view" type="button" aria-label="Podgląd"><svg class="i"><use href="#i-esp"/></svg></button>
        <button class="tile" data-go="v-house" type="button" aria-label="Dom"><svg class="i"><use href="#i-home"/></svg></button>
        <button class="tile" data-go="v-set" type="button" aria-label="Ustawienia"><svg class="i"><use href="#i-gear"/></svg></button>
      </div>
    </section>

    <!-- WIADOMOŚĆ -->
    <section class="view panel" id="v-msg" hidden>
      <div class="head"><button class="back" type="button" aria-label="Wstecz"><svg class="i"><use href="#i-back"/></svg></button></div>
      <div class="stage">
        <div class="bezel-lite"><div class="screen" id="edScreen"></div></div>
        
      </div>
      <div class="tools">
        <label class="tbtn" title="Dodaj zdjęcie"><svg class="i"><use href="#i-image"/></svg><input type="file" id="photoIn" accept="image/*" aria-label="Dodaj zdjęcie"></label>
        <button class="tbtn" id="cropBtn" type="button" aria-pressed="false" title="Ustaw kadr" disabled><svg class="i"><use href="#i-move"/></svg></button>
        <button class="tbtn" id="orderBtn" type="button" title="Zdjęcie przed / po tekście" disabled><svg class="i"><use href="#i-swap"/></svg></button>
        <button class="tbtn" id="rmPhoto" type="button" title="Usuń zdjęcie" disabled><svg class="i"><use href="#i-trash"/></svg></button>
      </div>
      <div class="zoom" id="zoomRow" hidden>
        <svg class="i"><use href="#i-zoom-s"/></svg>
        <input type="range" id="zoom" min="1" max="3" step="0.01" value="1" aria-label="Powiększenie zdjęcia">
        <svg class="i"><use href="#i-zoom-l"/></svg>
      </div>
      <textarea id="msgText" maxlength="2000" placeholder="Napisz wiadomość…"></textarea>
      <button class="send" id="sendBtn" type="button" aria-label="Wyślij na ESP"><svg class="i"><use href="#i-send"/></svg></button>
      <div class="onair" id="onAir">
        <div class="mini" id="onMini"></div>
        <div class="lbl"><span id="onTxt"></span></div><span class="steps" id="onSteps" aria-label="Status"><i></i><i></i><i></i></span>
        <button class="sbtn" id="editOn" type="button" aria-label="Edytuj"><svg class="i"><use href="#i-edit"/></svg></button>
        <button class="sbtn" id="clearOn" type="button" aria-label="Wygaś"><svg class="i"><use href="#i-off"/></svg></button>
      </div>
    </section>

    <!-- PODGLĄD -->
    <section class="view panel" id="v-view" hidden>
      <div class="head"><button class="back" type="button" aria-label="Wstecz"><svg class="i"><use href="#i-back"/></svg></button></div>
      <div class="device"><div class="ring"></div><div class="btns"><i></i><i></i></div><div class="spk"><i></i><i></i><i></i><i></i></div><div class="scr" id="devScr"></div></div>
      <div class="live" aria-label="Na żywo z urządzenia"><i></i></div>
    </section>

    <!-- DOM -->
    <section class="view panel" id="v-house" hidden>
      <div class="head"><button class="back" type="button" aria-label="Wstecz"><svg class="i"><use href="#i-back"/></svg></button></div>
      <div class="empty" aria-label="Wkrótce: lampy i czujniki"><div class="halo"><svg class="i"><use href="#i-bulb"/></svg></div></div>
    </section>

    <!-- USTAWIENIA -->
    <section class="view panel" id="v-set" hidden>
      <div class="head"><button class="back" type="button" aria-label="Wstecz"><svg class="i"><use href="#i-back"/></svg></button></div>
      <div class="rows">
        <div class="row"><svg class="i"><use href="#i-sun"/></svg><input type="range" id="bright" min="5" max="100" value="70" aria-label="Jasność"><span class="val" id="brightV" style="width:42px;text-align:right">70%</span></div>
        <div class="row"><svg class="i"><use href="#i-moon"/></svg><div class="lbl">Uśpij po 10 min</div><label class="switch"><input type="checkbox" id="sleepSw" checked aria-label="Automatyczne usypianie"><span></span></label></div>
        <div class="row"><svg class="i"><use href="#i-bolt"/></svg><div class="lbl">Ochrona baterii</div><label class="switch"><input type="checkbox" id="battSw" checked aria-label="Ochrona baterii"><span></span></label></div>
      </div>
      <div class="cap">Program</div>
      <div class="rows">
        <div class="row"><svg class="i"><use href="#i-update"/></svg><div class="lbl">Wersja</div><span class="val mono" id="ver">—</span></div>
        <div class="row"><label class="btn" style="flex:1;position:relative"><svg class="i"><use href="#i-update"/></svg><span id="binLbl">Wgraj plik .bin</span><input type="file" id="binIn" accept=".bin" style="position:absolute;inset:0;opacity:0;cursor:pointer" aria-label="Wybierz plik bin"></label></div>
        <div class="row" id="progRow" hidden><div class="lbl"><div class="prog"><i id="progFill"></i></div></div><span class="val" id="progTxt">0%</span></div>
      </div>
      <div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <button class="btn" id="rebootBtn" type="button" aria-label="Uruchom ESP ponownie"><svg class="i"><use href="#i-restart"/></svg></button>
        <button class="btn" id="logoutBtn" type="button" aria-label="Wyloguj"><svg class="i"><use href="#i-logout"/></svg></button>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast" hidden></div>


<script>
(() => {
  'use strict';
  /* ===================== połączenie z Supabase ===================== */
  const SB_URL = 'https://trzqhiimdoqexfunqpan.supabase.co';
  const SB_KEY = 'sb_publishable_R4qFJidKhqKurJNgbZe3eg_ynaFWLnM';   // klucz publiczny — dostęp i tak blokuje RLS
  const ONLINE_S = 30;                                                // ESP uznajemy za online, jeśli zgłosił się w ostatnich 30 s
  const PHOTO_PX = 466;                                               // rozdzielczość ekranu ESP

  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let toastT;
  const toast = t => { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200); };
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // ---- sesja ----
  let sess = store.get('esp.session');
  function setSess(j) {
    sess = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600) };
    store.set('esp.session', sess);
  }
  async function authPost(grant, body) {
    const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=${grant}`, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.error_description || j.msg || j.message || 'Błąd logowania'); e.status = r.status; throw e; }
    return j;
  }
  let refreshing = null;
  async function refresh() {
    if (!sess) throw Object.assign(new Error('auth'), { auth: true });
    refreshing = refreshing || authPost('refresh_token', { refresh_token: sess.refresh_token }).then(setSess).finally(() => refreshing = null);
    try { await refreshing; } catch (e) { if (e.status === 400 || e.status === 401) logout(); throw e; }
  }
  async function token() {
    if (!sess) throw Object.assign(new Error('auth'), { auth: true });
    if (Date.now() / 1000 > sess.expires_at - 60) await refresh();
    return sess.access_token;
  }
  async function req(path, { method = 'GET', body, headers = {}, raw = false } = {}, retry = true) {
    const h = { apikey: SB_KEY, Authorization: 'Bearer ' + await token(), ...headers };
    let b = body;
    if (body !== undefined && !(body instanceof Blob)) { h['Content-Type'] = 'application/json'; b = JSON.stringify(body); }
    const r = await fetch(SB_URL + path, { method, headers: h, body: b });
    if (r.status === 401 && retry) { await refresh(); return req(path, { method, body, headers, raw }, false); }
    if (!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
    if (raw) return r;
    const t = await r.text();
    return t ? JSON.parse(t) : null;
  }
  const db = {
    get: (t, q) => req(`/rest/v1/${t}?${q}`),
    patch: (t, q, body) => req(`/rest/v1/${t}?${q}`, { method: 'PATCH', body, headers: { Prefer: 'return=minimal' } }),
    insert: (t, body) => req(`/rest/v1/${t}`, { method: 'POST', body, headers: { Prefer: 'return=representation' } }).then(r => r[0])
  };
  // wysyłanie pliku z postępem (fetch nie podaje postępu)
  async function upload(bucket, path, blob, onProgress) {
    const t = await token();
    return new Promise((resolve, reject) => {
      const x = new XMLHttpRequest();
      x.open('POST', `${SB_URL}/storage/v1/object/${bucket}/${path}`);
      x.setRequestHeader('apikey', SB_KEY);
      x.setRequestHeader('Authorization', 'Bearer ' + t);
      x.setRequestHeader('Content-Type', blob.type || 'application/octet-stream');
      x.setRequestHeader('x-upsert', 'true');
      x.upload.onprogress = e => e.lengthComputable && onProgress && onProgress(e.loaded / e.total);
      x.onload = () => x.status < 300 ? resolve() : reject(new Error(`${x.status}: ${x.responseText}`));
      x.onerror = () => reject(new Error('Brak połączenia'));
      x.send(blob);
    });
  }
  const blobCache = new Map();
  async function fileURL(bucket, path) {
    const k = bucket + '/' + path;
    if (!blobCache.has(k)) {
      const r = await req(`/storage/v1/object/authenticated/${bucket}/${path}`, { raw: true });
      blobCache.set(k, URL.createObjectURL(await r.blob()));
    }
    return blobCache.get(k);
  }

  /* ===================== logowanie ===================== */
  function showApp(on) {
    $('login').hidden = on; $('app').hidden = !on;
    if (on) { poll(); } else { $('lPass').value = ''; setTimeout(() => $('lEmail').focus(), 50); }
  }
  $('login').addEventListener('submit', async e => {
    e.preventDefault();
    $('lErr').textContent = ''; $('lBtn').classList.add('busy'); $('lBtn').disabled = true;
    try {
      setSess(await authPost('password', { email: $('lEmail').value.trim(), password: $('lPass').value }));
      showApp(true);
    } catch (err) {
      $('lErr').textContent = err.status === 400 ? 'Zły e-mail albo hasło' : 'Brak połączenia — spróbuj jeszcze raz';
    } finally { $('lBtn').classList.remove('busy'); $('lBtn').disabled = false; }
  });
  function logout() {
    if (sess) fetch(`${SB_URL}/auth/v1/logout`, { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + sess.access_token } }).catch(() => {});
    sess = null; store.set('esp.session', null); showApp(false);
  }

  /* ===================== nawigacja ===================== */
  // Panel wjeżdża z prawej; wstecz: strzałka, przesunięcie od lewej krawędzi albo systemowe „wstecz”
  const home = $('v-home-screen');
  const EASE = 'cubic-bezier(.2,.8,.2,1)';
  let open = null, pushed = false, sw = null;
  const setHome = p => { home.style.transform = `translateX(${-22 * p}%)`; home.style.opacity = 1 - .65 * p; };
  const anim = ms => { const t = `transform ${ms}ms ${EASE}, opacity ${ms}ms ${EASE}`; if (open) open.style.transition = t; home.style.transition = t; };
  function go(id) {
    const p = $(id); if (open === p) return;
    if (open) open.hidden = true;
    open = p; p.hidden = false; p.scrollTop = 0;
    p.style.transition = home.style.transition = 'none';
    p.style.transform = 'translateX(100%)';
    p.offsetWidth;
    anim(320); p.style.transform = 'translateX(0)'; setHome(1);
    if (id === 'v-view') renderDevice();
    if (id === 'v-msg') renderEditor(true);
    if (id === 'v-set') loadConfig();
    try { history.pushState({ v: id }, ''); pushed = true; } catch (e) { pushed = false; }
  }
  function close() {
    if (!open) return;
    const p = open; anim(280); p.style.transform = 'translateX(100%)'; setHome(0); open = null;
    setTimeout(() => { if (open !== p) p.hidden = true; }, 300);
  }
  function goBack() { if (pushed && history.state && history.state.v) history.back(); else close(); }
  addEventListener('popstate', () => { pushed = false; close(); });
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  document.querySelectorAll('.back').forEach(b => b.addEventListener('click', goBack));
  addEventListener('touchstart', e => {
    if (!open || e.touches.length !== 1 || e.touches[0].clientX > 26) return;
    const t = e.touches[0];
    sw = { x0: t.clientX, y0: t.clientY, dx: 0, dir: null, lx: t.clientX, lt: performance.now(), v: 0 };
  }, { passive: true });
  addEventListener('touchmove', e => {
    if (!sw) return;
    const t = e.touches[0], dx = t.clientX - sw.x0, dy = t.clientY - sw.y0;
    if (!sw.dir) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      sw.dir = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
      if (sw.dir === 'h') { open.style.transition = home.style.transition = 'none'; open.classList.add('moving'); }
    }
    if (sw.dir !== 'h') { sw = null; return; }
    e.preventDefault();
    const now = performance.now();
    sw.v = (t.clientX - sw.lx) / Math.max(1, now - sw.lt); sw.lx = t.clientX; sw.lt = now;
    sw.dx = Math.max(0, dx);
    open.style.transform = `translateX(${sw.dx}px)`; setHome(1 - sw.dx / innerWidth);
  }, { passive: false });
  const endSwipe = () => {
    if (!sw) return;
    if (sw.dir === 'h' && open) {
      open.classList.remove('moving');
      if (sw.dx > innerWidth * .33 || sw.v > .45) goBack();
      else { anim(240); open.style.transform = 'translateX(0)'; setHome(1); }
    }
    sw = null;
  };
  addEventListener('touchend', endSwipe); addEventListener('touchcancel', endSwipe);

  /* ===================== stan urządzenia ===================== */
  let dev = null;
  function renderStatus() {
    const online = !!(dev && dev.online_at && (Date.now() - Date.parse(dev.online_at)) / 1000 < ONLINE_S);
    $('sWifi').classList.toggle('off', !online);
    $('sBt').classList.toggle('off', !(online && dev.bt));
    const b = dev && dev.battery != null ? dev.battery : null;
    $('sBatt').classList.toggle('chg', !!(online && dev.charging));
    $('sBatt').classList.toggle('low', b != null && b < 20 && !(dev && dev.charging));
    $('sBatt').classList.toggle('stale', !online);
    $('battFill').setAttribute('width', b == null ? 0 : Math.max(1.5, 21 * b / 100).toFixed(1));
    $('battPct').textContent = b == null ? '--' : b + '%';
    $('ver').textContent = dev && dev.fw_version ? dev.fw_version : '—';
  }
  setInterval(renderStatus, 5000);

  /* ===================== treść na okrągłym ekranie ===================== */
  // m: { text, photo: { url, w, h, x, y, z } | null, order: 'photo-first' | 'text-first' }
  function renderScreen(el, m, d, opts = {}) {
    el.style.setProperty('--d', d + 'px');
    if (!m || (!m.text && !m.photo)) { el.innerHTML = '<div class="blank"></div>'; return; }
    const ph = m.photo ? `<div class="ph${m.order === 'text-first' ? ' after' : ''}" data-ph><img src="${m.photo.url}" alt=""></div>` : '';
    const txt = m.text ? `<div class="tx${m.photo && m.order === 'photo-first' ? ' after' : ''}"><div class="sh l"></div><div class="sh r"></div>${esc(m.text).replace(/\n/g, '<br>')}</div>` : '';
    el.innerHTML = m.order === 'text-first' ? txt + ph : ph + txt;
    if (m.photo) placePhoto(el, m.photo, d);
    if (!opts.keepScroll) el.scrollTop = 0;
  }
  function fit(p, d) {
    const s = Math.max(d / p.w, d / p.h) * p.z, w = p.w * s, h = p.h * s;
    const mx = (w - d) / 2 / d, my = (h - d) / 2 / d;
    p.x = Math.max(-mx, Math.min(mx, p.x)); p.y = Math.max(-my, Math.min(my, p.y));
    return { w, h, left: d / 2 - w / 2 + p.x * d, top: d / 2 - h / 2 + p.y * d };
  }
  function placePhoto(el, p, d) {
    const img = el.querySelector('[data-ph] img'); if (!img) return;
    const f = fit(p, d);
    img.style.width = f.w + 'px'; img.style.height = f.h + 'px';
    img.style.transform = `translate(${f.left}px, ${f.top}px)`;
  }
  // kadr → dokładnie 466×466 pikseli, tak jak na ekranie ESP
  function renderPhoto(p) {
    return new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => {
        const c = document.createElement('canvas'); c.width = c.height = PHOTO_PX;
        const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, PHOTO_PX, PHOTO_PX);
        g.imageSmoothingQuality = 'high';
        const f = fit(p, PHOTO_PX);
        g.drawImage(im, f.left, f.top, f.w, f.h);
        c.toBlob(b => b ? resolve(b) : reject(new Error('Nie udało się przygotować zdjęcia')), 'image/jpeg', 0.86);
      };
      im.onerror = () => reject(new Error('Nie udało się wczytać zdjęcia'));
      im.src = p.url;
    });
  }

  /* ===================== edytor wiadomości ===================== */
  const draft = { text: '', photo: null, order: 'photo-first' };
  const ed = $('edScreen');
  const edSize = () => Math.min(300, Math.round(innerWidth * 0.74));
  let crop = false, sending = false;
  function renderEditor(keepScroll) {
    draft.text = $('msgText').value.trim();
    renderScreen(ed, draft, edSize(), { keepScroll });
    const has = !!draft.photo;
    ['cropBtn', 'orderBtn', 'rmPhoto'].forEach(id => $(id).disabled = !has);
    if (!has && crop) setCrop(false);
    $('zoomRow').hidden = !crop;
    $('sendBtn').disabled = sending || (!draft.text && !draft.photo);
  }
  function setCrop(on) {
    crop = on; $('cropBtn').setAttribute('aria-pressed', on); ed.classList.toggle('crop', on);
    if (on) { const ph = ed.querySelector('[data-ph]'); if (ph) ed.scrollTop = ph.offsetTop; }
    renderEditor(true);
  }
  function loadImage(url, cb) { const im = new Image(); im.onload = () => cb(im); im.src = url; }
  $('msgText').addEventListener('input', () => renderEditor(true));
  $('photoIn').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const url = URL.createObjectURL(f);
    loadImage(url, im => { draft.photo = { url, w: im.naturalWidth, h: im.naturalHeight, x: 0, y: 0, z: 1 }; $('zoom').value = 1; renderEditor(); });
    e.target.value = '';
  });
  $('cropBtn').addEventListener('click', () => setCrop(!crop));
  $('orderBtn').addEventListener('click', () => { draft.order = draft.order === 'photo-first' ? 'text-first' : 'photo-first'; renderEditor(); });
  $('rmPhoto').addEventListener('click', () => { draft.photo = null; renderEditor(); });
  $('zoom').addEventListener('input', e => { if (!draft.photo) return; draft.photo.z = +e.target.value; placePhoto(ed, draft.photo, edSize()); });
  let drag = null;
  ed.addEventListener('pointerdown', e => {
    if (!crop || !draft.photo || !e.target.closest('[data-ph]')) return;
    drag = { x: e.clientX, y: e.clientY, px: draft.photo.x, py: draft.photo.y }; ed.setPointerCapture(e.pointerId);
  });
  ed.addEventListener('pointermove', e => {
    if (!drag) return; const d = edSize();
    draft.photo.x = drag.px + (e.clientX - drag.x) / d; draft.photo.y = drag.py + (e.clientY - drag.y) / d;
    placePhoto(ed, draft.photo, d);
  });
  ed.addEventListener('pointerup', () => drag = null);
  ed.addEventListener('pointercancel', () => drag = null);

  $('sendBtn').addEventListener('click', async () => {
    if (sending) return;
    sending = true; $('sendBtn').classList.add('busy'); renderEditor(true);
    try {
      let photo_path = null;
      if (draft.photo) {
        const blob = await renderPhoto(draft.photo);
        photo_path = `${new Date().toISOString().slice(0, 10)}/${crypto.randomUUID()}.jpg`;
        await upload('photos', photo_path, blob);
      }
      await db.patch('messages', 'status=in.(sent,shown)', { status: 'cleared' });
      await db.insert('messages', { body: draft.text || null, photo_path, photo_first: draft.order === 'photo-first' });
      toast('Wysłano na ESP');
      setCrop(false);
      $('msgText').value = ''; draft.photo = null; draft.order = 'photo-first';
      await poll();
    } catch (err) {
      console.error(err); toast(err.auth ? 'Zaloguj się ponownie' : 'Nie udało się wysłać');
    } finally { sending = false; $('sendBtn').classList.remove('busy'); renderEditor(true); }
  });

  /* ===================== „teraz na ESP” ===================== */
  let last = null, lastView = null;            // ostatnia wiadomość z bazy i jej wersja do wyświetlenia
  const STEP = { sent: 1, shown: 2, read: 3, cleared: 0 };
  async function viewOf(m) {
    if (!m || m.status === 'cleared' || m.status === 'read') return null;
    let photo = null;
    if (m.photo_path) {
      try { photo = { url: await fileURL('photos', m.photo_path), w: PHOTO_PX, h: PHOTO_PX, x: 0, y: 0, z: 1 }; } catch (e) { photo = null; }
    }
    return { text: m.body || '', photo, order: m.photo_first ? 'photo-first' : 'text-first' };
  }
  function renderOnAir() {
    const v = lastView, el = $('onMini');
    if (!v) el.innerHTML = '<span class="ico"><svg class="i" style="width:18px;height:18px;stroke:#555"><use href="#i-off"/></svg></span>';
    else el.innerHTML = v.photo ? `<img src="${v.photo.url}" alt="">` : '<span class="ico"><svg class="i" style="width:18px;height:18px"><use href="#i-chat"/></svg></span>';
    $('onTxt').textContent = last ? (last.body || '') : '';
    const n = last ? STEP[last.status] : 0;
    [...$('onSteps').children].forEach((i, k) => { i.className = k < n ? (n === 3 ? 'read' : 'on') : ''; });
    $('onSteps').hidden = !last || last.status === 'cleared';
    $('editOn').disabled = !last; $('clearOn').disabled = !lastView;
    if (!$('v-view').hidden) renderDevice();
  }
  $('editOn').addEventListener('click', async () => {
    if (!last) return;
    const v = await viewOf({ ...last, status: 'sent' });
    $('msgText').value = v.text; draft.order = v.order;
    draft.photo = v.photo ? { ...v.photo } : null; $('zoom').value = 1;
    renderEditor(); open && open.scrollTo({ top: 0, behavior: 'smooth' });
  });
  $('clearOn').addEventListener('click', async () => {
    if (!last) return;
    try { await db.patch('messages', `id=eq.${last.id}`, { status: 'cleared' }); toast('Ekran ESP wygaszony'); await poll(); }
    catch (e) { toast('Nie udało się'); }
  });
  function renderDevice() {
    const host = $('devScr');
    const d = Math.round(host.getBoundingClientRect().width) || 280;
    let s = $('devScreen');
    if (!s) { host.innerHTML = '<div class="screen" id="devScreen"></div>'; s = $('devScreen'); }
    renderScreen(s, lastView, d, { keepScroll: true });
  }
  addEventListener('resize', () => { renderEditor(true); if (!$('v-view').hidden) renderDevice(); });

  /* ===================== odświeżanie ===================== */
  let polling = null;
  async function poll() {
    if (!sess) return;
    if (polling) return polling;
    polling = (async () => {
      try {
        const [st, msg] = await Promise.all([
          db.get('device_state', 'id=eq.esp&select=*'),
          db.get('messages', 'select=*&order=created_at.desc&limit=1')
        ]);
        dev = st && st[0] || null; renderStatus();
        const m = msg && msg[0] || null;
        if (!m || !last || m.id !== last.id || m.status !== last.status) { last = m; lastView = await viewOf(m); renderOnAir(); }
      } catch (e) { if (e.auth) logout(); else console.warn(e); }
      finally { polling = null; }
    })();
    return polling;
  }
  setInterval(() => { if (sess && document.visibilityState === 'visible') poll(); }, 3000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });

  /* ===================== ustawienia ===================== */
  let cfgT;
  async function loadConfig() {
    try {
      const c = (await db.get('device_config', 'id=eq.esp&select=*'))[0];
      if (!c) return;
      $('bright').value = c.brightness; $('brightV').textContent = c.brightness + '%';
      $('sleepSw').checked = c.sleep_min > 0; $('battSw').checked = c.battery_protect;
    } catch (e) { console.warn(e); }
  }
  function saveConfig() {
    clearTimeout(cfgT);
    cfgT = setTimeout(() => db.patch('device_config', 'id=eq.esp', {
      brightness: +$('bright').value, sleep_min: $('sleepSw').checked ? 10 : 0, battery_protect: $('battSw').checked, updated_at: new Date().toISOString()
    }).catch(() => toast('Nie zapisano ustawień')), 350);
  }
  $('bright').addEventListener('input', e => { $('brightV').textContent = e.target.value + '%'; saveConfig(); });
  $('sleepSw').addEventListener('change', saveConfig);
  $('battSw').addEventListener('change', saveConfig);
  $('rebootBtn').addEventListener('click', async () => {
    try { await db.insert('commands', { kind: 'reboot' }); toast('Restart ESP…'); } catch (e) { toast('Nie udało się'); }
  });
  $('logoutBtn').addEventListener('click', logout);

  // aktualizacja programu: wysyłka .bin → polecenie dla ESP → czekamy na potwierdzenie
  $('binIn').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    e.target.value = '';
    if (!/\.bin$/i.test(f.name)) { toast('To nie jest plik .bin'); return; }
    const setP = (p, txt) => { $('progRow').hidden = false; $('progFill').style.width = (p * 100) + '%'; $('progTxt').textContent = txt; };
    $('binLbl').textContent = f.name; setP(0, '0%');
    try {
      const path = `${Date.now()}-${f.name.replace(/[^\w.-]/g, '_')}`;
      await upload('firmware', path, new Blob([f], { type: 'application/octet-stream' }), p => setP(p * .9, Math.round(p * 100) + '%'));
      const cmd = await db.insert('commands', { kind: 'update', payload: { path, name: f.name, size: f.size } });
      setP(.92, '…');
      const t0 = Date.now(), before = dev && dev.fw_version;
      const wait = setInterval(async () => {
        try {
          const c = (await db.get('commands', `id=eq.${cmd.id}&select=done_at,payload`))[0];
          if (c && c.done_at) {
            clearInterval(wait); setP(1, '✓');
            toast(c.payload && c.payload.error ? 'ESP odrzuciło plik' : 'Zaktualizowano' + (dev && dev.fw_version && dev.fw_version !== before ? ' do ' + dev.fw_version : ''));
            setTimeout(() => { $('progRow').hidden = true; $('binLbl').textContent = 'Wgraj plik .bin'; }, 1500);
          } else if (Date.now() - t0 > 10 * 60 * 1000) {
            clearInterval(wait); $('progTxt').textContent = '?'; toast('ESP jeszcze nie potwierdziło — sprawdzi przy następnym połączeniu');
          }
        } catch (err) { /* spróbuj przy następnym obiegu */ }
      }, 3000);
    } catch (err) {
      console.error(err); $('progRow').hidden = true; $('binLbl').textContent = 'Wgraj plik .bin'; toast('Nie udało się wysłać pliku');
    }
  });

  /* ===================== start ===================== */
  renderStatus(); renderEditor(); renderOnAir();
  showApp(!!sess);
})();

</script>
</body>
</html>
