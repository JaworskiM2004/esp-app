<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ESP</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ESP">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  /* ESP v2 — aplikacja na telefon: duży podgląd na żywo (ten sam kod co na urządzeniu) i sterowanie ESP z telefonu. */
  :root { --bg:#000; --ink:#f2f2f2; --muted:#8a8a8a; --dim:#555; --line:#262626; --metal-1:#3b3b3b; --metal-2:#1a1a1a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overscroll-behavior:none;
    font:15px/1.45 -apple-system, system-ui, "Segoe UI", Inter, sans-serif; -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  main { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 22px); }
  .live { display:flex; align-items:center; gap:9px; font-size:13px; color:var(--muted); min-height:20px; text-align:center; }
  .dot { width:7px; height:7px; border-radius:50%; background:#3a3a3a; flex:none; transition:background .3s, box-shadow .3s; }
  .dot.on { background:#eaeaea; box-shadow:0 0 8px rgba(255,255,255,.55); }
  /* urządzenie: okrągła ramka z dwoma przyciskami po prawej, jak na płytce */
  .device { --d:min(84vw, 400px, calc(100vh - 260px)); position:relative; width:calc(var(--d) + 30px); height:calc(var(--d) + 30px); border-radius:50%;
    background:radial-gradient(circle at 30% 25%, var(--metal-1), var(--metal-2) 72%);
    box-shadow:0 22px 60px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; flex:none; }
  canvas { width:var(--d); height:var(--d); border-radius:50%; background:#000; display:block; touch-action:none; }
  .hw { appearance:none; -webkit-appearance:none; position:absolute; right:-8px; width:12px; height:48px; border-radius:6px; border:0; padding:0; z-index:2;
    background:linear-gradient(90deg, #4a4a4a, #8c8c8c); box-shadow:0 1px 2px rgba(0,0,0,.5); touch-action:none; }
  .hw:active { transform:translateX(-2px); }
  .hw.top { top:24%; } .hw.bot { top:62%; }
  .row { display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .chip { appearance:none; border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:999px; padding:8px 14px; font:inherit; font-size:13px; }
  .chip.on { color:var(--ink); border-color:#555; }
  form.login { display:flex; flex-direction:column; gap:8px; width:min(300px, 100%); }
  form.login input { background:#0d0d0d; border:1px solid var(--line); border-radius:12px; color:var(--ink); padding:12px 14px; font:inherit; -webkit-user-select:text; user-select:text; }
  form.login button { background:var(--ink); color:#000; border:0; border-radius:12px; padding:12px 14px; font:inherit; font-weight:600; }
  .err { color:#c9c9c9; font-size:12px; text-align:center; min-height:16px; }
  .hint { font-size:12px; color:var(--dim); text-align:center; max-width:340px; line-height:1.5; }
  a { color:var(--dim); }
</style>
</head>
<body>
<main>
  <div class="live"><span class="dot" id="dot"></span><span id="liveTxt">Connecting…</span></div>
  <div class="device">
    <canvas id="cv" width="466" height="466" aria-label="ESP screen"></canvas>
    <button class="hw top" id="top" type="button" aria-label="Top button: screen on/off"></button>
    <button class="hw bot" id="bot" type="button" aria-label="Bottom button: tap = apps/home, hold = flashlight"></button>
  </div>
  <div class="row">
    <button class="chip on" id="ctl" type="button">Controls the ESP</button>
  </div>
  <form class="login" id="login" hidden>
    <input type="email" id="em" placeholder="Email" autocomplete="username" required>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <div class="hint">Swipe up for apps, down for the quick panel, from the left edge to go back.
    Side buttons work like on the device. <a href="v1.html">Old app</a></div>
</main>
<script>
(async () => {
  'use strict';
  const $ = id => document.getElementById(id);
  const cv = $('cv'), X = cv.getContext('2d');
  const img = X.createImageData(466, 466), out = new Uint32Array(img.data.buffer);
  // RGB565 w kolejności bajtów ekranu → RGBA (tablica dla każdej wartości 16-bitowej)
  const lut = new Uint32Array(65536);
  for (let raw = 0; raw < 65536; raw++) {
    const v = ((raw & 255) << 8) | (raw >> 8);
    lut[raw] = (255 << 24) | ((((v & 31) * 255 / 31) | 0) << 16) | (((((v >> 5) & 63) * 255 / 63) | 0) << 8) | (((v >> 11) * 255 / 31) | 0);
  }
  let E;
  try {
    const res = await fetch('esp.wasm', { cache: 'no-cache' });
    E = (await WebAssembly.instantiate(await res.arrayBuffer(), {})).instance.exports;
  } catch (e) { $('liveTxt').textContent = 'Could not load the preview: ' + e; return; }
  E._initialize();
  let fb = new Uint16Array(E.memory.buffer, E.fb_ptr(), 466 * 466);

  // ---------------------------------------------------------------- baza (ta sama sesja co w starej aplikacji)
  const SB_URL = 'https://trzqhiimdoqexfunqpan.supabase.co', SB_KEY = 'sb_publishable_R4qFJidKhqKurJNgbZe3eg_ynaFWLnM';
  let sess = null; try { sess = JSON.parse(localStorage.getItem('esp.session')); } catch (e) {}
  const setSess = j => { sess = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600) };
                         try { localStorage.setItem('esp.session', JSON.stringify(sess)); } catch (e) {} };
  async function authPost(grant, body) {
    const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=${grant}`, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error_description || j.msg || 'Sign-in failed'), { status: r.status });
    return j;
  }
  let refreshing = null;
  async function token() {
    if (!sess) throw Object.assign(new Error('auth'), { auth: true });
    if (Date.now() / 1000 > sess.expires_at - 60) {
      refreshing = refreshing || authPost('refresh_token', { refresh_token: sess.refresh_token }).then(setSess).finally(() => refreshing = null);
      try { await refreshing; } catch (e) { if (e.status === 400 || e.status === 401) { sess = null; throw Object.assign(new Error('auth'), { auth: true }); } throw e; }
    }
    return sess.access_token;
  }
  async function rest(path, opt = {}) {
    const r = await fetch(SB_URL + path, { ...opt, headers: { apikey: SB_KEY, Authorization: 'Bearer ' + await token(), 'Content-Type': 'application/json', ...(opt.headers || {}) } });
    if (r.status === 401) { sess = null; throw Object.assign(new Error('auth'), { auth: true }); }
    if (!r.ok) throw new Error(r.status + ': ' + await r.text());
    const t = await r.text(); return t ? JSON.parse(t) : null;
  }
  const send = (kind, payload) => rest('/rest/v1/commands', { method: 'POST', body: JSON.stringify({ kind, payload }), headers: { Prefer: 'return=minimal' } }).catch(showErr);
  function showErr(e) {
    if (e && e.auth) { $('login').hidden = false; $('liveTxt').textContent = 'Sign in to connect to your ESP'; $('dot').className = 'dot'; }
  }
  $('login').addEventListener('submit', async ev => {
    ev.preventDefault(); $('err').textContent = '';
    try { setSess(await authPost('password', { email: $('em').value, password: $('pw').value })); $('login').hidden = true; $('pw').value = ''; poll(); ping(); }
    catch (e) { $('err').textContent = e.message; }
  });

  // ---------------------------------------------------------------- stan ESP (co 2 s) i podążanie za nim
  // ESP pisze w device_state.screen: „v2:ekran[:pozycja];b=jasność;d=cisza;v=głośność”.
  const SCREENS = { face: 0, apps: 1, quick: 2, torch: 3, app: 4, lamp: 5, games: 6, maze: 7, race: 8, pad: 9, orbit: 10, tower: 11, safe: 12, update: 13, settings: 14 };
  let control = true, dev = null, lastDev = '', localUntil = 0;
  $('ctl').addEventListener('click', () => { control = !control; $('ctl').classList.toggle('on', control); $('ctl').textContent = control ? 'Controls the ESP' : 'Preview only'; });
  async function poll() {
    try {
      const rows = await rest('/rest/v1/device_state?id=eq.esp&select=screen,battery,charging,online_at,fw_version,wifi_rssi,wifi_ssid,light_on,lamp_info');
      dev = rows && rows[0];
      const age = dev ? (Date.now() - Date.parse(dev.online_at)) / 1000 : 1e9;
      const online = !!dev && age < 90 && String(dev.fw_version || '').startsWith('v2');
      if (dev) dev.online = online;
      E.set_lamp(online && dev.light_on != null ? (dev.light_on ? 1 : 0) : -1);   // lampa: stan z ESP
      $('dot').className = 'dot' + (online ? ' on' : '');
      $('liveTxt').textContent = !dev ? 'No data from the ESP' : online
        ? `ESP online · ${dev.battery ?? '–'}%${dev.charging ? ' charging' : ''} · Wi-Fi ${dev.wifi_rssi} dBm`
        : `ESP offline · last seen ${age < 3600 ? Math.max(1, Math.round(age / 60)) + ' min' : Math.round(age / 3600) + ' h'} ago`;
      $('login').hidden = true;
      const s = String(dev && dev.screen || '');
      if (online && s !== lastDev && performance.now() > localUntil) {
        const [scr, ...kv] = s.split(';'), p = scr.split(':'), id = SCREENS[p[1]];
        const o = Object.fromEntries(kv.map(x => x.split('=')));
        if (o.b) E.set_bright(+o.b); if (o.d) E.set_dnd(+o.d); if (o.v) E.set_vol(+o.v);
        if (id !== undefined && (id !== E.get_screen() || (id === 4 && +p[2] !== E.get_app_item()))) { E.jump(id, +p[2] || 0); wake(); }
        mine = { scr: E.get_screen(), item: E.get_app_item(), b: E.get_bright(), d: E.get_dnd(), v: E.get_vol() };
      }
      lastDev = s;
    } catch (e) { if (e.auth) showErr(e); else $('liveTxt').textContent = 'No connection'; }
  }
  // „ping” co 20 s, gdy aplikacja jest na ekranie: ESP sprawdza wtedy polecenia co 0,7 s (sterowanie bez opóźnień)
  const ping = () => { if (sess && !document.hidden) send('ping', {}); };
  poll(); ping();
  setInterval(() => { if (!document.hidden && sess) poll(); }, 2000);
  setInterval(ping, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { poll(); ping(); } });

  // ---------------------------------------------------------------- sterowanie: zmiany zrobione w podglądzie idą do ESP
  let mine = { scr: E.get_screen(), item: E.get_app_item(), b: E.get_bright(), d: E.get_dnd(), v: E.get_vol() }, setT = 0;
  function syncOut() {
    const now = { scr: E.get_screen(), item: E.get_app_item(), b: E.get_bright(), d: E.get_dnd(), v: E.get_vol() };
    if (performance.now() < localUntil && control && dev && dev.online) {
      if (now.scr !== mine.scr || (now.scr === 4 && now.item !== mine.item)) send('input', { jump: now.scr, item: now.item });
      if (now.b !== mine.b || now.d !== mine.d || now.v !== mine.v) {          // ustawienia: jedno polecenie po 0,3 s spokoju
        clearTimeout(setT); setT = setTimeout(() => send('input', { set: { bright: E.get_bright(), dnd: !!E.get_dnd(), vol: E.get_vol() } }), 300);
      }
    }
    mine = now;
  }

  // ---------------------------------------------------------------- dotyk i przyciski
  const touch = { on: false, x: 233, y: 233 };
  const pos = ev => { const r = cv.getBoundingClientRect(), x = Math.round((ev.clientX - r.left) * 466 / r.width), y = Math.round((ev.clientY - r.top) * 466 / r.height);
                    return flipShown ? [465 - x, 465 - y] : [x, y]; };   // obraz obrócony (touchpad) — dotyk też
  let screenOn = true, lastInput = performance.now(), swallow = false;
  function wake() { lastInput = performance.now(); if (!screenOn) { screenOn = true; return true; } return false; }
  const local = () => { localUntil = performance.now() + 5000; };
  cv.addEventListener('pointerdown', ev => { local(); cv.setPointerCapture(ev.pointerId); swallow = wake(); if (swallow) { if (control && dev && dev.online) send('input', { key: 'top' }); return; } [touch.x, touch.y] = pos(ev); touch.on = true; });
  cv.addEventListener('pointermove', ev => { if (!touch.on) return; [touch.x, touch.y] = pos(ev); lastInput = performance.now(); local(); });
  const up = () => { touch.on = false; swallow = false; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  $('top').addEventListener('click', () => { local(); if (control && dev && dev.online) send('input', { key: 'top' }); if (screenOn) { if (!E.try_pause()) { screenOn = false; blank(); } } else wake(); });
  const bot = $('bot'); let botT = 0, botLong = false, botWake = false;
  bot.addEventListener('pointerdown', ev => { local(); bot.setPointerCapture(ev.pointerId); botWake = wake(); botLong = false;
    botT = setTimeout(() => { botLong = true; E.btn_long(); lastInput = performance.now(); }, 600); });
  bot.addEventListener('pointerup', () => { clearTimeout(botT); if (!botLong && !botWake) E.btn_short(); botWake = false; lastInput = performance.now(); local(); });
  bot.addEventListener('pointercancel', () => clearTimeout(botT));

  // ---------------------------------------------------------------- rysowanie
  let shownB = -1, flipShown = false;
  // dźwięki gier: te same próbki co na ESP (syntezator w esp.wasm), granie przez WebAudio — dopiero po pierwszym dotknięciu (zasada przeglądarek)
  let AC = null;
  const audioOn = () => { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} };
  cv.addEventListener('pointerdown', audioOn);
  function playSounds() {
    for (let code; (code = E.sfx_take()) >= 0;) {
      if (!AC || E.get_dnd()) continue;
      const n = E.sfx_render(code, E.get_vol()), src = new Int16Array(E.memory.buffer, E.sfx_buf(), n);
      const buf = AC.createBuffer(1, n, 16000), ch = buf.getChannelData(0);
      for (let i = 0; i < n; i++) ch[i] = src[i] / 32768;
      const s = AC.createBufferSource(); s.buffer = buf; s.connect(AC.destination); s.start();
    }
  }
  function blank() { X.fillStyle = '#000'; X.fillRect(0, 0, 466, 466); cv.style.filter = ''; shownB = -1; }
  function draw(b) {
    if (!fb.length) fb = new Uint16Array(E.memory.buffer, E.fb_ptr(), 466 * 466);
    for (let i = 0; i < out.length; i++) out[i] = lut[fb[i]];
    X.putImageData(img, 0, 0);
    const f = Math.min(1, b / Math.max(1, E.normal_brightness()));   // panel przyciemnia cały obraz — tu filtr
    if (Math.abs(f - shownB) > 0.004) { cv.style.filter = f >= 0.999 ? '' : `brightness(${f.toFixed(3)})`; shownB = f; }
  }
  function loop() {
    const now = performance.now();
    if (screenOn && now - lastInput > (E.get_screen() === 3 ? 300000 : 45000) && now > localUntil) { screenOn = false; blank(); }
    if (screenOn) {
      const d = new Date(), on = dev && dev.online;
      const b = E.frame(now | 0, touch.on ? 1 : 0, touch.x, touch.y, d.getHours(), d.getMinutes(), d.getSeconds(), d.getMilliseconds(),
                        d.getDate(), d.getMonth() + 1, d.getDay(), on && dev.battery != null ? dev.battery : -1, on && dev.charging ? 1 : 0);
      if (b >= 0) draw(b);
      const fl = !!E.flipped(); if (fl !== flipShown) { flipShown = fl; cv.style.transform = fl ? 'rotate(180deg)' : ''; }
      playSounds();
      if (E.power_req() && control && on) { /* wyłączenie z telefonu celowo nie istnieje — tylko na urządzeniu */ }
      syncOut();
      const lr = E.lamp_req();                                  // stuknięcie w lampę w podglądzie → prawdziwa lampa
      if (lr !== -99 && lr !== 3 && control && on) send('light', lr === 2 ? { ring: true } : { toggle: true });
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
